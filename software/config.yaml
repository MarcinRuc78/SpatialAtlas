# --- Marker genes table (optional) ---
markers_csv: "../examples/01_public_visium/output/markers.csv"

# --- Visualization defaults ---
display:
  default_point_size: 2.5
  default_opacity: 0.6
  default_colorscale: "Transparent-Green"
  spatial_plot_height: 850
  max_gene_dropdown: 500

  # Layout for spatial plots: "auto", "1x1", "1x2", "1x3", "1x4", "2x2"
  # "auto" chooses: 1 sample→1x1, 2→1x2, 3→1x3, 4→2x2
  layout: "auto"

# --- Multi-gene overlay defaults ---
multi_gene:
  gene_a: ""
  gene_b: ""
  gene_c: ""
  gene_d: ""

# --- Citation ---
citation:
  text: >
    Please cite the following paper if you utilize this atlas in your work.
  authors: "Author A, Author B, Author C"
  paper_title: "Your Paper Title Here"
  doi: "https://doi.org/10.xxxx/xxxxx"
  url: ""

# --- Server ---
server:
  host: "0.0.0.0"
  port: 8050
  debug: false
