# =============================================================================
# SpatialAtlas Configuration File
# =============================================================================
# Modify this file to customize the atlas for your own dataset.
# Supports: Visium (standard), Visium HD (binned or cell-segmented), GEO data.
# =============================================================================

# --- Project metadata ---
atlas:
  title: "SpatialAtlas validated example"
  subtitle: "10x Genomics Human Lymph Node (Visium v1)"
  logo: null   # path to logo PNG, or null to hide

# --- Data source type ---
# Supported: "h5ad", "spaceranger", "spaceranger_hd"
# If "h5ad" — provide pre-processed .h5ad files directly.
# If "spaceranger" — provide SpaceRanger output directories (v1.x / v2.x).
# If "spaceranger_hd" — provide Space Ranger HD output directory (v3.x/v4.x).
data_source: "h5ad"

# --- For Visium HD: resolution mode ---
# Only used when data_source is "spaceranger_hd".
# Options: "8um", "16um", "2um", "cell_segmentation"
# "cell_segmentation" uses CellPose/StarDist output from SpaceRanger.
hd_resolution: "8um"

# --- Samples (1 to 4 supported) ---
# Each sample needs: name, h5ad (or spaceranger_dir), image.
# The app auto-detects 1/2/3/4 samples and adjusts the subplot layout.
#
# Required fields in .h5ad:
#   .X             — expression matrix (sparse or dense)
#   .obs['cluster'] — cell/spot cluster labels (string)
#   .obsm['spatial'] — spatial coordinates (N x 2)
#   .obsm['UMAP']    — UMAP embedding (N x 2), optional
#
# If using SpaceRanger directories, prepare_data.py will generate the .h5ad.
samples:
  - name: "Human lymph node"
    h5ad: "../examples/01_public_visium/output/sample_human_lymph_node.h5ad"
    image: "../examples/01_public_visium/output/tissue_human_lymph_node.png"
    # display_image: "tissue_human_lymph_node.webp"  # optional browser-efficient copy
    scale_factor_x: 0.170111
    scale_factor_y: 0.170111
    offset_x: 0
    offset_y: 0
    img_xmin: 0
    img_xmax: 1921
    img_ymin: 0
    img_ymax: 2000



